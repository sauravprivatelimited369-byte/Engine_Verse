name: Public Credential Scan

# Implements step 4 of docs/INCIDENT_RESPONSE.md: look for credential material
# posted in public issues, pull requests, and comments. Issue #39 showed that a
# repository scan cannot see this surface, and that a manual search is only as
# reliable as the person who remembers to run it.
#
# This workflow is read-only by design: it calls GET endpoints and nothing
# else. The script never prints a matched value - only the issue/PR number, the
# location, and the field name - so a failed run is safe to share.
#
# A red run means a person must follow docs/INCIDENT_ISSUE_39_REDACTION.md
# (redact, close, rotate). Until #39 itself is redacted, this workflow is
# expected to fail: that is the reminder, not a flake.

on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  scan:
    name: Scan public issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Scan for posted credential digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/scan_public_credentials.py --repo "$GITHUB_REPOSITORY"
