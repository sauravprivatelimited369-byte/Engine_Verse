name: Learner Data Sync

# Merges a *maintainer-reviewed*, progress-only learner snapshot into
# `data/learners/registry.json`.
#
# Security note (audit 2026-10-18): this workflow previously triggered on
# any public GitHub issue titled "[engineverse-sync]" and pushed the result
# straight to main. Snapshots are unauthenticated by nature - there is no
# server behind the static Pages copy to prove who a submitter is - and the
# old merge even trusted a self-asserted `password_changed_via_otp` flag to
# replace another learner's stored password digest. That combination made
# the public registry an account-takeover and credential-storage hole.
#
# Now:
#   * registry records hold progress only - password digests and
#     email/phone identifiers are stripped by
#     backend/engineverse/github_storage.py and never committed;
#   * only a maintainer can start this workflow (workflow_dispatch), or a
#     caller holding a token with repository_dispatch permission. A learner
#     may still *open* a sync-request issue from the Pages copy, but a
#     maintainer reviews it and runs this workflow manually with the
#     snapshot as the payload input. Nothing is committed automatically
#     from an untrusted issue body.
on:
  repository_dispatch:
    types: [engineverse-learner-sync]
  workflow_dispatch:
    inputs:
      payload:
        description: "Reviewed learner snapshot JSON (progress only; credentials are stripped)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: learner-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate and merge learner snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          python scripts/sync_learner_data.py --self-check
          payload="$INPUT_PAYLOAD"
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            payload="$DISPATCH_PAYLOAD"
          fi
          printf '%s' "$payload" > "$RUNNER_TEMP/payload.txt"
          python scripts/sync_learner_data.py --file "$RUNNER_TEMP/payload.txt"

      - name: Commit updated learner registry
        run: |
          set -euo pipefail
          if git diff --quiet data/learners/registry.json; then
            echo "No changes to data/learners/registry.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learners/registry.json
          git commit -m "chore(learners): save reviewed learner progress snapshot"
          git push origin HEAD:main
