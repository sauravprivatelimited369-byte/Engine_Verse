name: GitHub Pages

# Builds the static EngineVerse reading copy, checks it, and deploys it to
# GitHub Pages. Any failed check stops the build job, so nothing is deployed.
#
# The Android app is built by android-build.yml. This workflow never builds or
# signs an APK; the install page links to a release only when the repository
# variable ENGINEVERSE_APK_URL names one that verify_apk_release.py confirms.
#
# One-time repository setup (needs an admin):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#   Settings -> Environments -> github-pages -> allow the branches below.

on:
  push:
    branches:
      - main
      # Working branch: deploys now; main takes over once it is merged.
      - arena/3d7dc793-engine-verse
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ENGINEVERSE_APP_URL: ${{ vars.ENGINEVERSE_APP_URL }}
  ENGINEVERSE_APK_URL: ${{ vars.ENGINEVERSE_APK_URL }}
  ENGINEVERSE_MACOS_URL: ${{ vars.ENGINEVERSE_MACOS_URL }}
  ENGINEVERSE_IOS_URL: ${{ vars.ENGINEVERSE_IOS_URL }}
  # PUBLIC origin of the FastAPI app that serves /api/voice. Not a secret, and
  # not a credential: it only tells the static page where to send text for
  # natural speech. Empty leaves the free browser/device voice reader working.
  ENGINEVERSE_VOICE_API_URL: ${{ vars.ENGINEVERSE_VOICE_API_URL }}
  # The public n8n Chat Trigger the static copy calls directly (there is no
  # server on Pages). Set as a repository *variable*, not a secret: the value
  # is published in the page by design. Leave it unset and the assistant page
  # says it is not connected on this copy rather than showing a dead chat box.
  ENGINEVERSE_ASSISTANT_PUBLIC_URL: ${{ vars.ENGINEVERSE_ASSISTANT_PUBLIC_URL }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The browser-runtime bundles (~170 MB of pinned toolchains) and their
    # end-to-end verification take most of this.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install --prefix .toolchain/jsdom jsdom@26

      - name: Check navigation, links, delivery rules and the exporter
        run: |
          python -m pytest -q backend/tests/test_navigation.py backend/tests/test_links.py \
            backend/tests/test_capabilities.py backend/tests/test_public_delivery.py \
            backend/tests/test_pages_live_contract.py backend/tests/test_static_export_contract.py \
            backend/tests/test_student_tools.py backend/tests/test_assistant.py \
            backend/tests/test_apple_project.py
          python scripts/export_pages.py --self-check
          python scripts/fetch_pyodide.py --self-check
          python scripts/fetch_browser_runtimes.py --self-check
          python scripts/verify_pages.py --self-check
          python scripts/verify_voice_api.py --self-check

      - name: Check the public backend before switching the site
        if: env.ENGINEVERSE_APP_URL != ''
        run: python scripts/verify_hosted_app.py --url "$ENGINEVERSE_APP_URL"

      - name: Check the public voice backend before publishing a voice-enabled site
        # A configured backend that is unreachable, missing /api/voice, or that
        # refuses the Pages origin fails here. With no variable set the export
        # uses only device speech and this gate is skipped, so an ordinary
        # release never depends on an ElevenLabs account being active.
        if: env.ENGINEVERSE_VOICE_API_URL != ''
        run: python scripts/verify_voice_api.py --url "$ENGINEVERSE_VOICE_API_URL"

      - name: Check the Android release before showing a download button
        if: env.ENGINEVERSE_APK_URL != ''
        run: python scripts/verify_apk_release.py --url "$ENGINEVERSE_APK_URL"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve and verify macOS & iOS packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ENGINEVERSE_MACOS_URL" ] || [ -z "$ENGINEVERSE_IOS_URL" ]; then
            if RELEASES_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases" 2>/dev/null)"; then
              # Rolling "latest build" releases are prereleases: they are for
              # direct download, not the versioned asset the site advertises
              # (verify_apple_release.py accepts only versioned tags).
              MAC_ASSET="$(printf '%s' "$RELEASES_JSON" | python -c 'import json,sys; rs=[r for r in json.load(sys.stdin) if not r.get("draft") and not r.get("prerelease")]; print(next((a["browser_download_url"] for r in rs for a in r.get("assets",[]) if a.get("name","").endswith(".dmg")), ""))')"
              IOS_ASSET="$(printf '%s' "$RELEASES_JSON" | python -c 'import json,sys; rs=[r for r in json.load(sys.stdin) if not r.get("draft") and not r.get("prerelease")]; print(next((a["browser_download_url"] for r in rs for a in r.get("assets",[]) if a.get("name","").endswith(".ipa")), ""))')"
              [ -z "$ENGINEVERSE_MACOS_URL" ] && [ -n "$MAC_ASSET" ] && echo "ENGINEVERSE_MACOS_URL=$MAC_ASSET" >> "$GITHUB_ENV" && ENGINEVERSE_MACOS_URL="$MAC_ASSET"
              [ -z "$ENGINEVERSE_IOS_URL" ] && [ -n "$IOS_ASSET" ] && echo "ENGINEVERSE_IOS_URL=$IOS_ASSET" >> "$GITHUB_ENV" && ENGINEVERSE_IOS_URL="$IOS_ASSET"
            fi
          fi
          if [ -n "$ENGINEVERSE_MACOS_URL" ] || [ -n "$ENGINEVERSE_IOS_URL" ]; then
            python scripts/verify_apple_release.py --macos-url "$ENGINEVERSE_MACOS_URL" --ios-url "$ENGINEVERSE_IOS_URL"
          else
            RUN_ID="$(gh run list --workflow=apple-build.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
            if [ -z "$RUN_ID" ]; then
              RUN_ID="$(gh run list --workflow=apple-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)"
            fi
            if [ -n "$RUN_ID" ]; then
              mkdir -p data/releases
              if gh run download "$RUN_ID" --name meridian-macos-dmg --dir data/releases && \
                 gh run download "$RUN_ID" --name meridian-ios-ipa --dir data/releases; then
                python scripts/verify_apple_release.py --local-dir data/releases
              else
                rm -rf data/releases
              fi
            fi
          fi

      - name: Export the public site
        shell: bash
        run: |
          if [ -n "$ENGINEVERSE_APP_URL" ]; then
            python scripts/export_pages.py --out site --gateway
          else
            python scripts/export_pages.py --out site --reading-copy
          fi

      - name: Verify the exported voice configuration and secret hygiene
        # ElevenLabs-enabled: apiBase must be the validated origin.
        # Device-only: apiBase must be empty; Listen still works in supporting
        # browsers. No key, agent id or signed URL may enter an exported page.
        shell: bash
        run: |
          if [ -n "$ENGINEVERSE_VOICE_API_URL" ]; then
            python scripts/verify_voice_api.py --url "$ENGINEVERSE_VOICE_API_URL" --site site
          else
            python scripts/verify_voice_api.py --site site
            echo "::notice::ENGINEVERSE_VOICE_API_URL is not set: the device voice reader works, while natural ElevenLabs voice and live conversations are unavailable."
          fi

      - name: Bundle the CPython runtime for the browser Python compiler
        # Pyodide (pinned in scripts/fetch_pyodide.py) makes Python on the
        # static copy real CPython. Non-fatal on purpose: if the registry is
        # down the site still deploys and browser Python reports NOT RUN.
        if: env.ENGINEVERSE_APP_URL == ''
        continue-on-error: true
        run: |
          python scripts/fetch_pyodide.py --out site/pyodide \
            || echo "::warning::Pyodide download failed - browser Python will report NOT RUN in this deployment"

      - name: Bundle the real language runtimes for the browser compiler
        # Pinned WebAssembly builds (scripts/fetch_browser_runtimes.py). A
        # failed download is left out of runtimes/manifest.json and that
        # language alone reports NOT RUN in this deployment.
        if: env.ENGINEVERSE_APP_URL == ''
        continue-on-error: true
        run: |
          python scripts/fetch_browser_runtimes.py --out site/runtimes \
            || echo "::warning::Browser runtime download failed - affected languages will report NOT RUN in this deployment"

      - name: Verify every bundled browser runtime end-to-end
        # Compiles and runs a real program (with stdin) per language through
        # the shipped worker files. A vendored runtime that cannot run fails.
        if: env.ENGINEVERSE_APP_URL == ''
        run: node scripts/check_browser_runtimes.js site

      - name: Check local progress, honest pages and the planner in the built site
        if: env.ENGINEVERSE_APP_URL == ''
        run: |
          node scripts/check_static_site.js site
          # The global stream switcher: the picker, the base-prefixed links and
          # the filter that hides every other branch's content.
          node scripts/check_stream_filter.js site
          # The question bank's topic filter: on this copy there is no server
          # to filter, so choosing a subject/topic must filter quiz-bank.json
          # in the browser - this is the check that keeps it from going back
          # to a form that submits and changes nothing.
          node scripts/check_question_bank.js site
          node scripts/check_planner.js site/planner/index.html site/static/js/planner.js
          # The assistant widget: launcher, n8n chat contract, error and retry
          # states, Esc, offline mode, the reload guard and HTML escaping.
          node scripts/check_assistant.js site

      - name: Check the voice reader and spoken tutor controls
        run: node scripts/check_voice.js

      - name: Refuse leaked demo passwords or tokens
        run: |
          if grep -R -I -n -E 'LearnBuild#2026!|TeachLearn#2026!|Str0ngPassphrase#42!|gh[pousr]_[A-Za-z0-9]{30,}' site; then
            echo "refusing to publish a password or token"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the published mode, exact commit and key pages
        shell: bash
        run: |
          if [ -n "$ENGINEVERSE_APP_URL" ]; then
            python scripts/verify_pages.py --url "$PAGES_URL" --sha "$GITHUB_SHA" \
              --mode gateway --app-url "$ENGINEVERSE_APP_URL"
          else
            python scripts/verify_pages.py --url "$PAGES_URL" --sha "$GITHUB_SHA" \
              --mode reading-copy
          fi
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
