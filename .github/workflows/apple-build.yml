name: Apple apps

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "apple/**"
      - "scripts/export_apple_catalog.py"
      - "scripts/verify_apple_release.py"
      - "backend/static/icons/icon-512.png"
      - ".github/workflows/apple-build.yml"
  pull_request:
    paths:
      - "apple/**"
      - "scripts/export_apple_catalog.py"
      - "scripts/verify_apple_release.py"
      - "backend/static/icons/icon-512.png"
      - ".github/workflows/apple-build.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag (e.g. apple-v1.0.0) to publish or update on GitHub Releases"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & test macOS (.dmg) and iOS (.ipa)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies for catalogue check
        run: pip install -r requirements.txt

      - name: Check Apple offline catalogue matches seed
        run: python scripts/export_apple_catalog.py --check

      - name: Import optional Apple signing credentials
        id: signing
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MACOS_ID: ${{ secrets.APPLE_MACOS_SIGN_IDENTITY }}
          IOS_ID: ${{ secrets.APPLE_IOS_SIGN_IDENTITY }}
          PROFILE_B64: ${{ secrets.APPLE_IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$CERT_PASS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Apple Developer certificate configured; building ad-hoc signed packages."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/meridian-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"
          echo "keychain=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$MACOS_ID" ]; then
            echo "MACOS_SIGN_IDENTITY=$MACOS_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$IOS_ID" ]; then
            echo "IOS_SIGN_IDENTITY=$IOS_ID" >> "$GITHUB_ENV"
          fi
          if [ -n "$PROFILE_B64" ]; then
            PROFILE_PATH="$RUNNER_TEMP/Meridian.mobileprovision"
            printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
            echo "IOS_PROVISION_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Run Swift tests and package macOS (.dmg) + iOS (.ipa)
        shell: bash
        run: |
          set +e +o pipefail
          bash apple/scripts/build_apple.sh --all 2>&1 | tee /tmp/apple-build.log
          status=${PIPESTATUS[0]}
          set -e -o pipefail
          if [ "$status" -ne 0 ]; then
            tail -45 /tmp/apple-build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
            exit "$status"
          fi
          grep -E "^(==> |    Built |Test Suite 'All tests')" /tmp/apple-build.log | while IFS= read -r line; do
            echo "::notice::${line}"
          done

      - name: Notarize macOS disk image when notary credentials are configured
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -z "$NOTARY_APPLE_ID" ] || [ -z "$NOTARY_TEAM_ID" ] || [ -z "$NOTARY_PASSWORD" ] || [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "Notarization secrets not configured; skipping notarytool."
            exit 0
          fi
          xcrun notarytool submit apple/build/out/Meridian-macOS.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple apple/build/out/Meridian-macOS.dmg
          (cd apple/build/out && shasum -a 256 Meridian-macOS.dmg > Meridian-macOS.dmg.sha256)

      - name: Verify built macOS (.dmg) and iOS (.ipa) packages
        run: python scripts/verify_apple_release.py --local-dir apple/build/out

      - name: Clean up temporary keychain and provisioning profile
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain }}
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/Meridian.mobileprovision"

      - name: Upload macOS disk image (.dmg)
        uses: actions/upload-artifact@v7
        with:
          name: meridian-macos-dmg
          path: |
            apple/build/out/Meridian-macOS.dmg
            apple/build/out/Meridian-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload iOS app package (.ipa)
        uses: actions/upload-artifact@v7
        with:
          name: meridian-ios-ipa
          path: |
            apple/build/out/Meridian-iOS.ipa
            apple/build/out/Meridian-iOS.ipa.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach packages to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Determine target GitHub Release tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          TAG=""
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$EVENT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select((.draft == false) and (.tag_name | startswith("apple-v")) and ([.assets[].name | endswith(".dmg")] | any | not)) | .tag_name' 2>/dev/null | head -n 1 || true)"
          fi
          case "$TAG" in
            "")
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            v[0-9]*|apple-v[0-9]*|macos-v[0-9]*|ios-v[0-9]*)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Refusing invalid release tag: $TAG" >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@v8
        if: steps.target.outputs.publish == 'true'
        with:
          name: meridian-macos-dmg
          path: release-out

      - uses: actions/download-artifact@v8
        if: steps.target.outputs.publish == 'true'
        with:
          name: meridian-ios-ipa
          path: release-out

      - name: Upload assets to GitHub Release
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Meridian $TAG" \
              --notes "Native Meridian apps for macOS (universal .dmg) and iOS (.ipa), with SHA-256 digests."
          fi
          gh release upload "$TAG" \
            release-out/Meridian-macOS.dmg \
            release-out/Meridian-macOS.dmg.sha256 \
            release-out/Meridian-iOS.ipa \
            release-out/Meridian-iOS.ipa.sha256 \
            --clobber
