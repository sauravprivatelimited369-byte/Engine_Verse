name: Java sandbox

on:
  push:
    paths:
      - "sandbox-java/**"
      - "backend/engineverse/judge/java_bridge.py"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "sandbox-java/**"
      - "backend/engineverse/judge/java_bridge.py"
  workflow_dispatch:

jobs:
  build:
    name: Compile and test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The sandbox has no runtime dependencies, so this also proves the
      # artifact is self-contained.
      - name: Build
        # -q suppressed the compiler diagnostics, so a red build reported an exit
        # code and nothing else. Failures are echoed as annotations because raw
        # job logs are not reachable from the REST API.
        working-directory: sandbox-java
        shell: bash
        run: |
          set +e +o pipefail
          mvn -B -DskipTests package 2>&1 | tee /tmp/mvn.txt
          status=${PIPESTATUS[0]}
          set -e -o pipefail
          if [ "$status" -ne 0 ]; then
            grep -E "\[ERROR\]" /tmp/mvn.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Test
        working-directory: sandbox-java
        run: mvn -B test

      - name: Smoke test the built jar
        working-directory: sandbox-java
        run: |
          printf '%s' '{"language":"java","code":"public class Main { public static void main(String[] a) { System.out.println(42); } }","stdin":"","timeoutMs":10000,"memoryKb":262144}' \
            | java -Xmx256m -jar target/engineverse-sandbox.jar | tee verdict.json
          grep -q '"status":"accepted"' verdict.json
          grep -q '"stdout":"42\\n"' verdict.json

      - name: A compile error must be reported, not crash the sandbox
        working-directory: sandbox-java
        run: |
          printf '%s' '{"language":"java","code":"public class Main { public static void main(String[] a) { int x = ; } }","stdin":"","timeoutMs":10000,"memoryKb":262144}' \
            | java -Xmx256m -jar target/engineverse-sandbox.jar | tee verdict.json
          grep -q '"status":"compile_error"' verdict.json

      - name: A non-Java language must be refused cleanly
        working-directory: sandbox-java
        run: |
          printf '%s' '{"language":"python","code":"print(1)","stdin":"","timeoutMs":1000,"memoryKb":65536}' \
            | java -Xmx256m -jar target/engineverse-sandbox.jar | tee verdict.json
          grep -q '"status":"unsupported_language"' verdict.json

      - uses: actions/upload-artifact@v6
        if: matrix.java == '21'
        with:
          name: engineverse-sandbox-jar
          path: sandbox-java/target/engineverse-sandbox.jar
