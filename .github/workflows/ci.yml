name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
  # The networked link check is slow and can be failed by a publisher rate
  # limiting us, so it runs on a schedule rather than blocking every push.
  schedule:
    - cron: "0 4 * * 1"   # 04:00 UTC every Monday
  workflow_dispatch:

jobs:
  python:
    name: Python · tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Everything the suite needs is pinned in requirements.txt. This step
          # used to follow it with a bare `pip install pytest pytest-asyncio
          # sqlglot`, which resolves to whatever is newest and silently overrode
          # those pins - so CI tested a different toolchain than the one the pins
          # describe, and a new pytest release could turn a green suite red for a
          # reason nothing in the repository changed.
          pip install -r requirements.txt

      - name: Seed a throwaway database
        run: |
          cp .env.example .env
          python scripts/seed.py --fresh --stats
        env:
          ENGINEVERSE_DB_PATH: data/ci.sqlite3

      - name: Run the test suite
        # pipefail matters: without it the pipeline's status is tee's, and a red
        # suite would report success.
        shell: bash
        run: |
          set +e +o pipefail
          python -m pytest backend/tests -q --tb=short 2>&1 | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          set -e -o pipefail
          exit "$status"
        env:
          ENGINEVERSE_SECRET: ci-only-secret-not-used-in-production-0123456789
          ENGINEVERSE_DB_PATH: data/ci.sqlite3
          ENGINEVERSE_ENV: test

      - name: Surface test failures as annotations
        # Raw job logs are only reachable from a browser session. Workflow
        # annotations are readable over the REST API, so echoing the failure
        # lines here is what makes a red run diagnosable from a script or a
        # sandbox that cannot open the Actions UI.
        if: failure()
        run: |
          { grep -E "^(FAILED|ERROR) " /tmp/pytest.txt | head -40; \
            grep -E "^E  " /tmp/pytest.txt | head -40; } | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -5 /tmp/pytest.txt | while IFS= read -r line; do
            echo "::notice::${line}"
          done

      - name: Verify trusted academy examples (report missing compilers explicitly)
        run: python scripts/verify_academy.py

      - name: n8n workflows are structurally valid
        # Parses the committed JSON, checks connections and trigger settings,
        # refuses committed credentials, and parses each Code node with Node
        # when it is available. It does not import them into n8n - that needs a
        # running instance and the owner's credentials.
        run: python scripts/check_n8n_workflows.py

      - name: Every resource URL is well-formed
        # Offline: no network needed, so it runs on every push. Catches
        # malformed URLs, non-https links, private hosts and placeholders.
        run: python scripts/check_links.py --offline
        env:
          ENGINEVERSE_DB_PATH: data/ci.sqlite3

      - name: Report seed volume
        run: python scripts/seed.py --stats
        env:
          ENGINEVERSE_DB_PATH: data/ci.sqlite3

      - name: Native offline catalogues match seed
        run: |
          python scripts/export_android_catalog.py --check
          python scripts/export_apple_catalog.py --check

  postgres:
    name: PostgreSQL · schema applies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engineverse
          POSTGRES_PASSWORD: engineverse
          POSTGRES_DB: engineverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engineverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Apply the production schema
        env:
          PGPASSWORD: engineverse
        shell: bash
        run: |
          # GitHub runs `shell: bash` as `bash -eo pipefail`, so a failing
          # pipeline aborts the script on the spot and the annotation block below
          # never runs. -e is switched off around the pipeline and the exit code
          # taken from PIPESTATUS instead, which is the only way to report why.
          set +e +o pipefail
          psql -h localhost -U engineverse -d engineverse -v ON_ERROR_STOP=1 \
            -f db/postgres/schema.pg.sql 2>&1 | tee /tmp/psql.txt
          status=${PIPESTATUS[0]}
          set -e -o pipefail
          if [ "$status" -ne 0 ]; then
            echo "::error::psql exited ${status}; last 30 lines of output follow"
            tail -30 /tmp/psql.txt | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Verify partitions and row limits were created
        env:
          PGPASSWORD: engineverse
        run: |
          psql -h localhost -U engineverse -d engineverse -v ON_ERROR_STOP=1 <<'SQL'
          -- Every partitioned table must have its full fan-out. This raises
          -- rather than selecting: a bare SELECT with a HAVING clause returns
          -- zero rows and exits 0 when the partitions are missing, so the old
          -- version of this check passed whether or not it had verified anything.
          DO $do$
          DECLARE found integer;
          BEGIN
            SELECT count(*) INTO found FROM (
              SELECT c.relname
                FROM pg_inherits i JOIN pg_class c ON c.oid = i.inhparent
               WHERE c.relname IN ('submissions','activity','audit_logs','coding_submissions')
               GROUP BY c.relname
              HAVING count(i.inhrelid) >= 128
            ) satisfied;
            IF found <> 4 THEN
              RAISE EXCEPTION 'expected 4 hash-partitioned tables with >=128 partitions, found %', found;
            END IF;
          END $do$;

          -- Inserts must land in a partition rather than failing.
          --
          -- Two things this used to get wrong, both of which let it pass while
          -- checking nothing: it selected the question from an empty `questions`
          -- table (so the INSERT affected zero rows), and it passed the boolean
          -- `true` for `is_correct`, which is BIGINT because the SQLite schema
          -- declares it INTEGER. A zero-row insert satisfies any constraint.
          INSERT INTO users (id, email, username, password_hash, password_changed_at, created_at, updated_at)
          VALUES ('01TEST', 'schema-check@engineverse.test', 'schemacheck', 'scrypt$16384$8$1$AA$BB', 0, 0, 0);
          INSERT INTO questions (id, slug, kind, stem, created_at)
          VALUES ('01Q', 'schema-check-question', 'mcq', 'Partition routing check.', 0);
          INSERT INTO submissions (id, user_id, question_id, is_correct, created_at)
          VALUES ('01SUB', '01TEST', '01Q', 1, 0);

          -- Assert the row is physically in a child partition. `tableoid` on a
          -- partitioned table resolves to the partition the row landed in, so a
          -- value of the parent would mean hashing never happened.
          DO $do$
          DECLARE routed text;
          BEGIN
            SELECT tableoid::regclass::text INTO routed FROM submissions WHERE id = '01SUB';
            IF routed IS NULL THEN
              RAISE EXCEPTION 'the submission row is missing';
            END IF;
            IF routed = 'submissions' THEN
              RAISE EXCEPTION 'the row landed in the parent table, not a partition';
            END IF;
            RAISE NOTICE 'submission routed into %', routed;
          END $do$;
          SQL

      - name: Re-applying the schema must be a no-op
        env:
          PGPASSWORD: engineverse
        run: |
          psql -h localhost -U engineverse -d engineverse -v ON_ERROR_STOP=1 \
            -f db/postgres/schema.pg.sql

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: The release step must migrate and seed without demo accounts
        env:
          PGPASSWORD: engineverse
          ENGINEVERSE_DB_URL: postgresql://engineverse:engineverse@localhost:5432/bootcheck
          ENGINEVERSE_SECRET: ci-boot-check-only-not-a-real-secret
          ENGINEVERSE_ENV: production
          ENGINEVERSE_SITE_URL: https://ci.example.test
          ENGINEVERSE_JUDGE: disabled
          # This runner has no SMTP server and no SMS gateway. Password-only
          # sign-in is the application default now, and it is stated here anyway
          # so the boot check keeps passing if that default is ever changed
          # again. Tests that cover the required-code mode set it themselves,
          # and they have to provide a transport to do so.
          ENGINEVERSE_LOGIN_OTP: disabled
        run: |
          # The web image no longer migrates or seeds on start. This step is
          # what deploy/docker-compose.yml runs as the release service, against
          # a real empty database. It still has to prove:
          #
          #   1. psycopg is installed (requirements.txt leaves it commented out).
          #   2. db.migrate() picks schema.pg.sql, not the SQLite fts5 schema.
          #   3. The seeder does not emit SQLite-only DML.
          #   4. Production seeding does not create the published demo accounts.
          #   5. The runtime role cannot CREATE TABLE.
          #
          # A separate database is used so this is a genuine first boot rather
          # than the tables psql already created above.
          psql -h localhost -U engineverse -d postgres -c 'CREATE DATABASE bootcheck'
          pip install --quiet -r requirements.txt 'psycopg[binary]==3.2.6'
          python -m pytest backend/tests/test_api_and_schema.py -k "psycopg_accepts" -q
          python scripts/release.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from engineverse import db

          for table in ("branches", "subjects", "topics", "notes",
                        "questions", "dpp_questions", "flashcards"):
              rows = db.row_count(table)
              assert rows > 0, f"{table} is empty after release.py - the boot produced no catalogue"
              print(f"  {table}: {rows}")
          users = db.row_count("users")
          assert users == 0, f"production release created {users} users; demo accounts must not be seeded"
          tables = db.schema_table_count()
          assert tables > 50, f"expected a full schema, found {tables} tables"
          print(f"  schema tables: {tables}")
          PY
          psql -h localhost -U engineverse -d bootcheck -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE engineverse_app LOGIN PASSWORD 'apppassapppassappp';
          GRANT CONNECT ON DATABASE bootcheck TO engineverse_app;
          GRANT USAGE ON SCHEMA public TO engineverse_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO engineverse_app;
          REVOKE CREATE ON SCHEMA public FROM engineverse_app;
          SQL
          # The role must fail at CREATE TABLE even if the application check is
          # bypassed. psql exits non-zero; that is the assertion.
          set +e
          PGPASSWORD=apppassapppassappp psql -h localhost -U engineverse_app -d bootcheck \
            -c 'CREATE TABLE engineverse_should_fail (id int);'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "engineverse_app was allowed to create a table" >&2
            exit 1
          fi
          ENGINEVERSE_DB_URL=postgresql://engineverse_app:apppassapppassappp@localhost:5432/bootcheck \
            python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "backend")
          os.environ["ENGINEVERSE_DB_URL"] = "postgresql://engineverse_app:apppassapppassappp@localhost:5432/bootcheck"
          from engineverse.config import reload_settings
          reload_settings()
          from engineverse import db
          try:
              db.migrate()
          except db.DatabaseError as exc:
              if "engineverse_app" not in str(exc):
                  raise
              print("runtime role correctly refused to migrate")
          else:
              raise SystemExit("runtime role was allowed to migrate")
          PY

  javascript:
    name: Assets · no build step required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The 3D scene check runs the shipped scenes through the shipped renderer,
      # which needs the Python that defines them. No third-party packages.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: The client bundle parses as valid JavaScript
        # sw.js is checked too: it is the other script the browser runs, and a
        # syntax error there breaks offline caching silently rather than loudly.
        run: |
          for f in backend/static/js/*.js backend/static/sw.js scripts/*.js; do
            node --check "$f"
          done

      - name: The 3D renderer's maths is correct
        # Runs the real mesh builders under a DOM stub and asserts finite
        # geometry, clamping, the arrow orientation maths and the projection.
        run: node scripts/check_engine3d.js

      - name: Every stored 3D scene can actually be drawn
        # A scene that validates as JSON can still name a mesh the renderer
        # does not have; this builds all 48 with the browser's own code.
        run: python scripts/dump_scenes.py | node scripts/check_scenes.js

      - name: Install the exported-site browser dependencies
        # jsdom only: the exported pages need a DOM, storage and events, not a
        # rendering engine. Playwright would download a browser binary here.
        run: npm install --prefix .toolchain/jsdom jsdom@26

      - name: Build the public reading copy
        # The exported Pages site is what visitors actually use, and it is a
        # separate artefact from the FastAPI app: this step renders it exactly
        # as the deploy workflow does.
        run: |
          pip install -r requirements.txt
          python scripts/export_pages.py --out site --reading-copy

      - name: Local progress, export/import and honest pages in the exported site
        # Runs the shipped pages with the shipped runtime under jsdom: old
        # browser accounts are migrated and their secrets deleted, settings
        # export/import validates its input, the personal pages render learner
        # text as text, and no page posts to a server, links to "#" or asks a
        # visitor to sign in. Then the study planner end to end.
        run: |
          node scripts/check_static_site.js site
          node scripts/check_planner.js site/planner/index.html site/static/js/planner.js
          node scripts/check_assistant.js site

      - name: The voice reader and spoken tutor controls behave
        # No network and no credentials: the backend and ElevenLabs are stubbed.
        # Checks text extraction, chunking, one active player, blob cleanup,
        # error states and that the microphone is untouched until Start.
        run: node scripts/check_voice.js

      - name: No CDN or third-party origins are referenced
        run: |
          if grep -rnE 'https?://[^"]*(cdn|unpkg|jsdelivr|googleapis|gstatic)' \
               backend/static backend/templates; then
            echo "error: a third-party asset host is referenced" >&2
            exit 1
          fi
          echo "OK: every asset is self-hosted"

  links:
    name: Links · external URLs still resolve
    # Weekly and on demand only. Fetching a few hundred publisher URLs on every
    # push is slow and would fail pull requests for reasons outside this repo.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed a throwaway database
        run: |
          cp .env.example .env
          python scripts/seed.py --fresh
        env:
          ENGINEVERSE_DB_PATH: data/ci.sqlite3

      - name: Fetch every resource URL
        # Non-zero only on a genuine failure. 403/429/451 are warnings: plenty
        # of publishers refuse automated clients, and failing on that would make
        # the whole check noise.
        run: python scripts/check_links.py --timeout 20 --concurrency 8
        env:
          ENGINEVERSE_DB_PATH: data/ci.sqlite3
