<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MERIDIAN mark: an M inside a meridian ring, with the orbit's signal dot.
       The M is the study path (up, over, up); the ring is the line of reference;
       the blue dot is the point the reader is working toward. Source of truth
       for every app icon - see scripts/gen_brand_icons.py -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19375f"/>
      <stop offset=".58" stop-color="#0f2544"/>
      <stop offset="1" stop-color="#0a1a30"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="1" stop-color="#2f7cf6"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#tile)"/>
  <rect x="3.6" y="3.6" width="56.8" height="56.8" rx="13.4" fill="none" stroke="#dbe8ff" stroke-opacity=".16" stroke-width="1.2"/>
  <g id="mark">
    <circle cx="32" cy="32" r="21" fill="none" stroke="#dbe8ff" stroke-opacity=".3" stroke-width="1.6"/>
    <path d="M20 42 V24 L32 36 L44 24 V42" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38.6 11.6A21 21 0 0 1 52.4 27.4" fill="none" stroke="url(#orbit)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="52.4" cy="27.4" r="2.5" fill="#2f7cf6"/>
  </g>
</svg>
