<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FORGE mark: an anvil and the spark of a hammer strike, on obsidian glass.
       The anvil is where raw metal becomes a tool; the spark is the moment of
       work. Source of truth for every app icon — see scripts/gen_brand_icons.py -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#261b11"/>
      <stop offset=".55" stop-color="#14100d"/>
      <stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#tile)"/>
  <rect x="3.6" y="3.6" width="56.8" height="56.8" rx="14.4" fill="none" stroke="url(#ember)" stroke-opacity=".55" stroke-width="1.2"/>
  <path d="M45 6.5 L47 11.3 L52 13.3 L47 15.3 L45 20.1 L43 15.3 L38 13.3 L43 11.3 Z" fill="url(#ember)"/>
  <path d="M11 24.5 H36 Q43.5 26.8 50.5 29.4 Q43.5 31.6 36 32.8 H32.5 V37.8 L35.8 40.6 V43.8 H41 V49.6 H16 V43.8 H21.2 V40.6 L24.5 37.8 V32.8 H11 Z" fill="#fff7ed"/>
