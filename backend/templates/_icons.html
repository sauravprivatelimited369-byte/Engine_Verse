{# ==========================================================================
   Icon set. One macro, every icon the navigation and the index page use.

   These were previously pasted inline as raw <svg> in base.html, three times
   over for the desktop bar, the account menu and the mobile bar. A macro keeps
   them in one place, which is what lets the navigation be generated from
   engineverse/navigation.py instead of hand-written per surface: a destination
   names its icon by key and every surface draws the same glyph.

   All icons are 24x24, stroke-based, and inherit currentColor so themes and
   hover states work without a second copy. `aria-hidden` is set by the caller
   when the icon sits next to a visible text label.
   ========================================================================== #}

{# An unknown key draws nothing rather than raising: a typo in the table must
   not take a page down, and the missing glyph is obvious enough to spot. #}
{%- set paths = GLYPHS.get(name, []) -%}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="{{ 'currentColor' if filled else 'none' }}"
     stroke="currentColor" stroke-width="{{ 2 if not filled else 0 }}" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">{% for d in paths %}<path d="{{ d }}"/>{% endfor %}</svg>
{%- endmacro %}
